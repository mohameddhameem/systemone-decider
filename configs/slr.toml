# The Stage-Level Routing (SLR) setup on HotpotQA (stair_common 0.3.0): its Config B grid, split, labels and routers'
# scores, read from the public STAIR repo at a pinned commit, where they sit under the setup author's folder.
#   uv run slr fetch    # once, on a machine with internet (downloads only)
#   uv run slr verify   # the ruler, the split and the setup's certified rows
#   uv run slr ladder   # always-* paths and the oracle on slr-val and slr-test
repo = "mohameddhameem/STAIR"
commit = "5b69ccef5bbb30d4cc5606f45a16695466770e21"   # tag slr-config-b-2026-10-19: not on main, the tag keeps it
out = "runs/slr"                                        # the fetched files, at their repo paths (git ignores runs/)
results = "results/slr"
dev = "data/hotpotqa/distractor_validation.parquet"     # HotpotQA dev in file order: the setup's positions (`idx`)

