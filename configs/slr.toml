# The setup's certified sealed-test rows. `verify` re-selects each router's thresholds on slr-val with the setup's rule
# (`peak` or `parity`) from the routers' val scores (`val` = [retrieval, answering] run folders), checks they are the
# ones it froze (t = [retrieval, answer under weak retrieval, under strong]), and replays them on slr-test from
# test_scores.
[[certified]]
name = "always-strong"
path = "SS"
lenient = 76.77
price = 929.0

[[certified]]
name = "SLR SFT (label)"
ret = "ret_label"
qa = "qa_label"
val = ["sft_router5_ret", "sft_router5_qa"]
rule = "peak"
t = [0.95, 1.00, 1.00]
lenient = 76.70
price = 834.8

[[certified]]
name = "SLR SFT (label) + reward"
ret = "ret_label"
qa = "qa_reward"
val = ["sft_router5_ret", "reward_train_qa"]
rule = "parity"
t = [0.80, 0.55, 0.60]
lenient = 75.96
price = 664.7
