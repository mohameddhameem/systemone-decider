# What the release scripts read besides the reports. Keep `train` in step with the training plans the weights came from.
github = "mohameddhameem/systemone-decider"
# how the menu cards credit the menu's labels (the user's wording, 2026-10-25); push_hf.py refuses menu while it holds TODO
menu_credit = "Mohamed Dhameem and collaborators, [STAIR](https://github.com/mohameddhameem/STAIR)"

[pair]   # one decision: Qwen2.5-1.5B-Instruct (top 2 passages) or Qwen2.5-7B-Instruct (all 10)
max_drop = 0.01   # the operating threshold: lenient accuracy within 1% of always-large's on calibration
train = { epochs = 2, lr = 1e-4, batch_size = 16, dev_fraction = 0.1 }

[menu]   # two decisions, weak first: retrieval (Qwen2.5-7B / 72B), then the answer (Llama-3.2-3B / 3.1-70B)
max_drop = 0.01   # the default thresholds: the cheapest weak-first point within 1% of always-strong's accuracy on slr-val
train = { epochs = 2, lr = 1e-4, batch_size = 16, dev_fraction = 0.1 }
